    html, body { margin: 0; background: #F5EFEF; }
    #sage-startup {
      position: fixed; inset: 0; z-index: 2147483647;
      display: grid; place-items: center;
      background: #F5EFEF; color: #96615A;
      opacity: 1; transition: opacity 420ms ease;
    }
    .sage-starting flutter-view { visibility: hidden; }
    .sage-startup-wordmark { width: min(76vw, 540px); height: auto; overflow: visible; }
    .sage-startup-track, .sage-startup-outline {
      fill: transparent; stroke-width: 16;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .sage-startup-track { stroke: #D5C0BD; opacity: .45; }
    .sage-startup-outline {
      stroke: #96615A; stroke-dasharray: 1; stroke-dashoffset: 1;
      transition: fill 300ms ease;
    }
    #sage-startup.is-ready .sage-startup-outline { fill: #96615A; }
    #sage-startup.is-waiting .sage-startup-wordmark {
      animation: sage-startup-wait 1600ms ease-in-out infinite;
    }
    @keyframes sage-startup-wait {
      0%, 14%, 28%, 100% { opacity: 1; }
      7%, 21% { opacity: .28; }
    }
    #sage-startup.is-leaving { opacity: 0; pointer-events: none; }
    .sage-startup-sr {
      position: absolute; width: 1px; height: 1px; padding: 0;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    #sage-startup-recovery {
      position: absolute; top: calc(50% + 90px); left: 24px; right: 24px;
      text-align: center; font: 14px/1.7 system-ui, sans-serif; color: #784E48;
    }
    #sage-startup-recovery[hidden] { display: none; }
    #sage-startup-retry {
      border: 1px solid #C0A09C; border-radius: 8px; padding: 8px 20px;
      background: transparent; color: inherit; font: inherit; cursor: pointer;
    }
    #sage-startup-retry:focus-visible { outline: 2px solid #96615A; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      #sage-startup, .sage-startup-outline { transition: none; }
      #sage-startup.is-waiting .sage-startup-wordmark { animation: none; }
    }
  </style>
