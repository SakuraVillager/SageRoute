# Static hosting only: this config contains no map proxy or application backend.
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;
    root /var/www/sageroute/current;
    ssl_certificate YOUR_CERTIFICATE;
    ssl_certificate_key YOUR_CERTIFICATE_KEY;
    include mime.types;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css font/otf font/ttf application/vnd.ms-opentype;

    location ~ ^/(assets|canvaskit|icons)/ {
        try_files $uri =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
    }
    # Missing resources must never receive index.html.
    location ~ \.[^/]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
